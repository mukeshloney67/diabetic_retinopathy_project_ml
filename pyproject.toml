[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diabetic-retinopathy-project-ml"
version = "0.1.0"
description = "Diabetic retinopathy image classification with TensorFlow and InceptionV3."
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Project contributors" }]
dependencies = [
    "tensorflow>=2.21,<2.22",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "PyYAML>=6.0,<7",
    "matplotlib>=3.8,<4",
    "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
dr-prepare = "dr_classifier.cli:prepare_main"
dr-train = "dr_classifier.cli:train_main"
dr-evaluate = "dr_classifier.cli:evaluate_main"
dr-predict = "dr_classifier.cli:predict_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
